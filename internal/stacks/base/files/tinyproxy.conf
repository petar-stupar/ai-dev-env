# The allowlist proxy. Everything the container sends out goes through here
# when the namespace's network is "allowlist"; aide-network.sh writes the
# filter and installs the firewall rules that make this the only way out.
User tinyproxy
Group tinyproxy
Port 3128
Listen 127.0.0.1
Timeout 600
MaxClients 200
LogLevel Connect
LogFile "/var/log/aide-proxy/tinyproxy.log"
PidFile "/run/aide-proxy/tinyproxy.pid"
# Hosts are matched against the patterns in the filter file; anything that
# matches none is refused.
Filter "/etc/aide/proxy/filter"
FilterExtended On
FilterDefaultDeny Yes
# CONNECT is for TLS, and for ssh (git over ssh; see aide-network.sh). The
# host filter applies to both.
ConnectPort 443
ConnectPort 22
